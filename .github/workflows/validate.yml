name: validate

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Repository validation
        run: python tools/validate_repository.py

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Build and validate executable
        shell: powershell
        run: .\tools\build_release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CNKI2WOS-1.0.0-Windows-x64
          path: |
            dist/CNKI2WOS_1.0.0_Windows_x64.exe
            dist/SHA256SUMS.txt
